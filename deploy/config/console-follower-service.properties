# console follower config file

role=service
listening=0.0.0.0
address=127.0.0.1
port=6000

console.host=127.0.0.1
console.port=7080

# Node identity (optional).
#
# The node reports its name as "<identity>#<role>#<port>", and the console derives the
# expected name the same way from its own identity. When the console and the node run on
# the same machine both identities are equal and the names match exactly.
# Set node.id explicitly to pin the identity - required when the node and the console run
# on different machines, or to keep the name stable across hardware changes.
# The console still falls back to matching by "#<role>#<port>" (must be unique) if the
# prefixes differ, so an explicit value is optional.
#node.id=
