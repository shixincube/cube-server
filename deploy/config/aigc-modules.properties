# AIGC business action module list.
#
# Syntax:
#   module.<n>.class= <fully qualified class name>   (required)
#   module.<n>.enabled  = true | false  (optional, default true)
#   module.<n>.optional = true | false  (optional, default false)
#
# Rules:
#   - Implementation must be a public class with a public no-arg constructor,
#     implementing cube.aigc.spi.ActionModule.
#   - The module jar MUST be placed in deploy/libs/ (same ClassLoader as the host).
#     NEVER put it into deploy/cellets/ - Carpet loads those in an isolated
#     ClassLoader, which would make the shared SPI types invisible.
#   - Load order per module: enabled switch -> instantiate -> bind actions ->
#     setup(host). setup MUST come after bind so that a module's own state is
#     already visible to its actions; otherwise a dispatch thread may observe a
#     not-yet-initialized instance.
#   - module.<n>.optional comes from the descriptor, NOT from this file. It only
#     records the failure: a module that fails setup is always skipped and never
#     blocks the host from starting. hasBlockingFailure() reports whether any
#     non-optional module failed.
#   - requiredCapabilities is verified by AIGCCellet#verifyModuleCapabilities(),
#     NOT at load time - units register later via Relay, so a load-time check
#     would report false negatives for every module.
#   - Modules are loaded in ascending <n> order; load order is bind order.
#   - Duplicate action names are rejected: the FIRST registration wins, later
#     ones log an ERROR and are skipped. A module with any rejected binding is
#     treated as NOT loaded.
#   - Reserved action names (checkToken / event / setup / teardown) can never
#     be bound by any module.
#   - Chinese text may only appear in '#' comment lines, because .properties is
#     decoded as ISO-8859-1. A Chinese value would be silently garbled.
#
# This file ships with ZERO enabled modules: the action router stays empty and
# every request keeps walking the original action branch chain.
#
# ── Psychology module (Phase 2, first batch) ─────────────────────────────
#
# Module : cube.service.psychology.PsychologyModule
# Actions: setPaintingReportState / getPaintingLabel / setPaintingLabel
#
# JAR LOCATION
#   Built as : service-psychology/build/jar/cube-service-psychology.jar
#               then copied to ../build/cube-service-psychology-3.0.jar
#               and finally to deploy/libs/cube-service-psychology-3.0.jar
#   It MUST live in deploy/libs/, sharing one ClassLoader with the host.
#   NEVER place it into deploy/cellets/: Carpet loads those jars in an isolated
#   ClassLoader, so the shared cube.aigc.spi.* types become invisible and
#   Class.forName() is bound to fail.
#
# CLASSPATH, TWO PATHS
#   In IDEA (Run 'ServiceStart'): the module comes from the IDEA module
#     classpath (service-psychology/build/classes). This works because
#     service/service.iml declares a COMPILE-scope orderEntry on
#     service-psychology. Rebuild after editing plugin sources.
#   From the command line (ant deploy): the module comes from the jar under
#     deploy/libs/.
#   Either way service-psychology must have been compiled at least once.
#
# HOW TO ENABLE
#   1. Make sure deploy/libs/cube-service-psychology-3.0.jar exists (make deploy)
#   2. Uncomment the three lines below
#   3. Restart the service. The module is discovered and bound during
#      AIGCCellet#install()
#   4. Check the log for:
#      "#load - Loaded 1 AIGC action module(s), 3 action(s) bound"
#
# HOW TO ROLL BACK
#   Re-comment the three lines below and restart. The corresponding else-if
#   branches in AIGCCellet were NEVER removed during the migration, so they
#   keep serving the three actions. Zero-risk rollback.
#
#   Do NOT use module.1.enabled=false for a staged rollout: it also falls back
#   to the else-if branches, but it additionally emits a
#   "is DISABLED by configuration" INFO line, which is easy to misread as a
#   load failure. Commenting out the whole block is unambiguous.
#
# NOTE ON WORKING DIRECTORY
#   Module paths are resolved against the process working directory, which in
#   development is the 'service' directory (see .idea/workspace.xml
#   ServiceStart WORKING_DIRECTORY). Hence:
#     - this file is read from service/config/aigc-modules.properties
#     - config/psychology.json holds the database settings
#   Keep this file and deploy/config/aigc-modules.properties in sync.
#
# module.1.class=cube.service.psychology.PsychologyModule
# module.1.enabled=true
# module.1.optional=false
