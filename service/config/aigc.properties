# AIGC config file

# Performance settings
# cached / fixed
threadpool.type=cached
threadpool.max=8

# 节点权重
unit.weight.531001=10.0

# 上下文长度
context.length=-1
# Baize 的上下文长度
context.length.baize=-1
# Baize2 的上下文长度
context.length.baize2=-1


# 页面搜索器
page.searcher="bing"

# ===== SKILL 技能 =====
# 技能种子目录，多个使用逗号分隔，相对工作目录。
# 技能的唯一权威来源是存储器（DB 表 aigc_skill），多实例共享；
# 目录仅用于引导与兜底，可通过下面的 skills.seed 导入 DB。
skills.path=assets/skills/
# 技能缓存刷新间隔（毫秒）。各实例惰性刷新，DB 变更最长在该间隔后生效。
skills.cache.ttl=60000
# SKILL 指令允许占用的上下文预算百分比，防止整篇技能把上下文吃光（1~90）。
skills.budget.ratio=25
# 启动时是否把 skills.path 下的技能导入存储器（幂等：同名已存在则跳过）。
skills.seed=false
# 导入时是否覆盖存储器中的同名技能。
skills.seed.overwrite=false

# 是否使用中继（Relay）接口，一般中继接口仅用于测试
relay=true
