# AIGC config file

# Performance settings
# cached / fixed
threadpool.type=cached
threadpool.max=8

# 节点权重
unit.weight.531001=10.0

# 上下文长度
context.length=-1
# Baize 的上下文长度
context.length.baize=-1
# Baize2 的上下文长度
context.length.baize2=-1


# 页面搜索器
page.searcher="bing"

# ===== SKILL 技能 =====
# 技能种子目录，多个使用逗号分隔，相对工作目录。
# 技能的唯一权威来源是存储器（DB 表 aigc_skill），多实例共享；
# 目录仅用于引导与兜底，可通过下面的 skills.seed 导入 DB。
skills.path=assets/skills/
# 技能缓存刷新间隔（毫秒）。各实例惰性刷新，DB 变更最长在该间隔后生效。
skills.cache.ttl=60000
# 启动时是否把 skills.path 下的技能导入存储器（幂等：同名已存在则跳过）。
skills.seed=false
# 导入时是否覆盖存储器中的同名技能。
skills.seed.overwrite=false

# ===== 技能的自动装载与会话绑定 =====
# 是否按技能声明的 keywords 自动装载技能。只有作者显式声明了 keywords 的技能才会被自动装载，
# 命中用户原始请求（分词命中或原文包含）即启用——声明关键词即视为作者的授权。
skills.auto=true
# 单次自动装载的技能数量上限。
skills.auto.limit=2
# 是否在提示词中注入技能目录（可用技能清单），让模型知道平台上有哪些技能。
skills.catalog=true
# 是否启用会话级技能绑定：同一频道内本轮启用的技能，后续轮次无需再次传参也持续生效。
# 技能指令不进入多轮历史，没有绑定则第二轮起技能会失效。
skills.session=true
# 技能绑定的生存时间（毫秒），超时未更新的绑定自动失效。
skills.session.ttl=1800000
# 技能绑定的本地缓存时间（毫秒），降低多实例部署下的读库频率。
skills.session.cache.ttl=30000

# ===== 提示词编排（PromptComposer）=====
# 是否启用按比例分段编排。关闭后退化为顺序模式（不做比例切分），用于出问题时的行为回退。
prompt.composer=true
# 为模型输出预留的上下文比例（%），从上下文窗口中先扣除。
prompt.output.reserve.ratio=25
# 各弹性段的预算占比（%，相对扣除系统说明与用户请求后的可用额度）。
# 顺序：技能目录 → 技能指令 → 已知信息 → 历史对话；某段未用满的额度顺延给后面的段。
prompt.catalog.ratio=4
prompt.skill.ratio=30
prompt.retrieval.ratio=33
prompt.history.ratio=33

# ===== Token 估算 =====
# 初始的「每 Token 字符数」。模型单元返回真实用量（inputTokens/outputTokens）后会自动校准。
token.chars.per.token=1.8
# 校准的 EWMA 平滑系数（0~1），越大越贴近最近一次实测。
token.calibration.alpha=0.3

# 是否使用中继（Relay）接口，一般中继接口仅用于测试
relay=true
